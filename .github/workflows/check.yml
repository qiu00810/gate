name: VPN Gate Node Check
on:
  schedule:
    # 时区换算：UTC每日16点 = 北京时间次日0点（也就是你要的每天晚上零点）
    # 注：GitHub定时任务存在10-15分钟的正常调度延迟，不会精准踩点触发
    - cron: "0 16 * * *"
  workflow_dispatch: # 保留手动随时触发的入口
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gate-check
  cancel-in-progress: false # 不中断正在运行的检测任务，避免生成残缺的静态页
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (可替换为自己部署的专属检测端点更稳定)
          CHECK_WORKER: "https://sckos.hallo22.ccwu.cc/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"
      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Actions 部署模式的 Pages"
            # 移除了原配置中冗余的source参数（workflow模式下传该参数会触发API校验报错）
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # 替换了原写死的占位符地址，动态生成正确的站点URL
      - name: Show site URL
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          echo "✅ 部署完成，站点地址: https://${OWNER}.github.io/${REPO_NAME}/"
          echo "本次部署状态: ${{ steps.deployment.outcome }}"
